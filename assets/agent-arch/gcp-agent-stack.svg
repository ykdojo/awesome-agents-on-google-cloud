<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="960" height="770" fill="#FFFFFF"/>

  <!-- Layer: Tools and knowledge (top) -->
  <rect x="20" y="20" width="690" height="130" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="36" y="48" font-size="12" font-weight="700" letter-spacing="1.5" fill="#B45309">TOOLS AND KNOWLEDGE</text>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="45" y="75" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="145" y="102">MCP servers</text>
    <rect x="265" y="75" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="102">Agent Search RAG</text>
    <rect x="485" y="75" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="585" y="102">Databases + vectors</text>
  </g>

  <!-- Layer: Memory and state -->
  <rect x="20" y="170" width="690" height="130" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="36" y="198" font-size="12" font-weight="700" letter-spacing="1.5" fill="#BE185D">STATE AND MEMORY</text>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="45" y="225" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="145" y="252">Sessions</text>
    <rect x="265" y="225" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="252">Memory Bank</text>
    <rect x="485" y="225" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="585" y="252">Cloud SQL / pgvector</text>
  </g>

  <!-- Layer: Runtime -->
  <rect x="20" y="320" width="690" height="130" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="36" y="348" font-size="12" font-weight="700" letter-spacing="1.5" fill="#047857">RUNTIME: WHERE THE AGENT LIVES</text>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="45" y="375" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="145" y="402">Agent Runtime</text>
    <rect x="265" y="375" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="402">Cloud Run</text>
    <rect x="485" y="375" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="585" y="402">GKE</text>
  </g>

  <!-- Layer: Framework -->
  <rect x="20" y="470" width="690" height="130" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="36" y="498" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6D28D9">FRAMEWORK: HOW YOU WRITE IT</text>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="125" y="525" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="205" y="552">ADK 2.x</text>
    <rect x="305" y="525" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="445" y="552">LangGraph / CrewAI / LlamaIndex</text>
  </g>

  <!-- Layer: Model (bottom) -->
  <rect x="20" y="620" width="690" height="130" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="36" y="648" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1D4ED8">MODEL: THE BRAIN</text>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="45" y="675" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="145" y="702">Gemini 3.x API</text>
    <rect x="265" y="675" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="702">Gemma 4 self-hosted</text>
    <rect x="485" y="675" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="585" y="702">Model Garden 200+</text>
  </g>

  <!-- Upward arrows in the gaps between layers -->
  <line x1="365" y1="619" x2="365" y2="603" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="365" y1="469" x2="365" y2="453" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="365" y1="319" x2="365" y2="303" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="365" y1="169" x2="365" y2="153" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Cross-cutting sidebar -->
  <rect x="730" y="20" width="210" height="730" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="835" y="48" font-size="12" font-weight="700" letter-spacing="1.5" fill="#475569" text-anchor="middle">CROSS-CUTTING</text>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="746" y="80" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="835" y="107">Cloud Trace + OTel</text>
    <rect x="746" y="270" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="835" y="297">Agent Evaluation</text>
    <rect x="746" y="460" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="835" y="487">Model Armor</text>
    <rect x="746" y="650" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="835" y="677">Agent Identity</text>
  </g>
</svg>
